apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aeris-postgres
spec:
  serviceName: aeris-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aeris-postgres
  template:
    metadata:
      labels:
        app: aeris-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_DB
              value: aeris
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeris-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeris-redis
  template:
    metadata:
      labels:
        app: aeris-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeris-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aeris-minio
  template:
    metadata:
      labels:
        app: aeris-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2026-02-14T17-37-42Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
