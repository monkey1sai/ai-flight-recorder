services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      AERIS_AUTO_BOOTSTRAP: "true"
      AERIS_SEED_DEMO: "true"
      AERIS_REPOSITORY_BACKEND: postgres
      AERIS_DRIVE_CONNECTOR_MODE: ${AERIS_DRIVE_CONNECTOR_MODE:-auto}
      AERIS_GOOGLE_CLIENT_SECRETS_PATH: ${AERIS_GOOGLE_CLIENT_SECRETS_PATH:-/workspace-host/credentials.json}
      AERIS_GOOGLE_TOKEN_PATH: ${AERIS_GOOGLE_TOKEN_PATH:-/var/lib/aeris/google-auth/token.json}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aeris
      REDIS_URL: redis://redis:6379/0
      BLOB_ENDPOINT: http://minio:9000
      BLOB_STORAGE_ROOT: /var/lib/aeris/blobstore
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - api-blob-data:/var/lib/aeris/blobstore
      - ../../tmp/google-auth:/var/lib/aeris/google-auth
      - ../../:/workspace-host:ro

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8080}
    depends_on:
      - api

  edge-daemon:
    build:
      context: ../..
      dockerfile: infra/docker/edge-daemon.Dockerfile
    environment:
      AERIS_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      AERIS_SPOOL_DIR: /var/spool/aeris
      AERIS_BLOB_DIR: /var/blob/aeris
    depends_on:
      - otel-collector

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aeris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

  otel-collector:
    image: otel/opentelemetry-collector:0.126.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../k8s/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro

volumes:
  api-blob-data:
  postgres-data:
