services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aeris
      REDIS_URL: redis://redis:6379/0
      BLOB_ENDPOINT: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8080
    depends_on:
      - api

  edge-daemon:
    build:
      context: ../..
      dockerfile: infra/docker/edge-daemon.Dockerfile
    environment:
      AERIS_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      AERIS_SPOOL_DIR: /var/spool/aeris
      AERIS_BLOB_DIR: /var/blob/aeris
    depends_on:
      - otel-collector

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: aeris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2026-02-14T17-37-42Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  otel-collector:
    image: otel/opentelemetry-collector:0.126.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../k8s/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"
