[project]
name = "aeris-schema"
version = "0.1.0"
description = "Canonical schema migration slice for AERIS Flight Recorder."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.12,<0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

