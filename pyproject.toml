[project]
name = "aeris"
version = "0.1.0"
description = "Bootstrap skeleton for the AERIS Flight Recorder observability platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-auth>=2.41,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "httpx>=0.28,<0.29",
    "pg8000>=1.31.5",
    "pydantic>=2.12,<3.0",
    "requests>=2.32,<3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.12,<0.13",
]

[tool.uv]
package = false

[tool.uv.sources]
"annotated-types" = { path = "vendor/python/wheels/annotated_types-0.7.0-py3-none-any.whl" }
anyio = { path = "vendor/python/wheels/anyio-4.13.0-py3-none-any.whl" }
certifi = { path = "vendor/python/wheels/certifi-2026.2.25-py3-none-any.whl" }
colorama = { path = "vendor/python/wheels/colorama-0.4.6-py2.py3-none-any.whl" }
fastapi = { path = "vendor/python/wheels/fastapi-0.116.1-py3-none-any.whl" }
h11 = { path = "vendor/python/wheels/h11-0.16.0-py3-none-any.whl" }
httpcore = { path = "vendor/python/wheels/httpcore-1.0.9-py3-none-any.whl" }
httpx = { path = "vendor/python/wheels/httpx-0.28.1-py3-none-any.whl" }
idna = { path = "vendor/python/wheels/idna-3.11-py3-none-any.whl" }
iniconfig = { path = "vendor/python/wheels/iniconfig-2.3.0-py3-none-any.whl" }
mypy = { path = "vendor/python/wheels/mypy-1.19.1-py3-none-any.whl" }
packaging = { path = "vendor/python/wheels/packaging-25.0-py3-none-any.whl" }
pluggy = { path = "vendor/python/wheels/pluggy-1.6.0-py3-none-any.whl" }
pydantic = { path = "vendor/python/wheels/pydantic-2.12.5-py3-none-any.whl" }
"pydantic-core" = { path = "vendor/python/wheels/pydantic_core-2.41.5-cp312-cp312-win_amd64.whl" }
pygments = { path = "vendor/python/wheels/pygments-2.19.2-py3-none-any.whl" }
pytest = { path = "vendor/python/wheels/pytest-8.4.2-py3-none-any.whl" }
ruff = { path = "vendor/python/wheels/ruff-0.12.8-py3-none-win_amd64.whl" }
sniffio = { path = "vendor/python/wheels/sniffio-1.3.1-py3-none-any.whl" }
starlette = { path = "vendor/python/wheels/starlette-0.47.2-py3-none-any.whl" }
"typing-extensions" = { path = "vendor/python/wheels/typing_extensions-4.15.0-py3-none-any.whl" }
"typing-inspection" = { path = "vendor/python/wheels/typing_inspection-0.4.2-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web/.next", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["apps/web"]
